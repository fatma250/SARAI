name: CI/CD

on:
  push:
    branches: [Main]
    paths-ignore:
      - 'deploy/manifest.env'
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: sarai-production-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sarai-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sarai-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libfreetype6-dev libjpeg-dev zlib1g-dev

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check (syntax errors)
        working-directory: backend
        run: python -m compileall -q .
      - name: Import check (app must construct without a live DB)
        working-directory: backend
        run: python -c "import main"
        env:
          JWT_SECRET_KEY: ci-only-dummy-key-not-used-in-production

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL || 'http://localhost:8000' }}

  build-and-push:
    if: github.event_name == 'push'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PROD_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main

      - name: Write manifest
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          cat > deploy/manifest.env <<EOF
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG=$TAG
          DEPLOYED_COMMIT=${{ github.sha }}
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/manifest.env
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore(deploy): update manifest to ${{ github.sha }} [skip ci]"
          git push origin HEAD:Main

  deploy:
    needs: update-manifest
    runs-on: [self-hosted, sarai-prod]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull & deploy
        run: |
          set -a
          source backend/.env
          source deploy/manifest.env
          set +a
          docker compose -f deploy/docker-compose.prod.yml pull
          docker compose -f deploy/docker-compose.prod.yml up -d

      - name: Prune old images
        run: docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy in time" >&2
          exit 1
